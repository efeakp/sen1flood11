data:
  raw_dir: data/raw
  processed_dir: data/processed
  split_file: data/raw/flood_handlabeled_split.csv
  img_size: 512
  in_channels: 2  # VV + VH

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  num_classes: 1

training:
  epochs: 50
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  early_stopping_patience: 10
  mixed_precision: true

augmentation:
  horizontal_flip: true
  vertical_flip: true
  random_rotate_90: true
  random_brightness_contrast: true

logging:
  checkpoint_dir: checkpoints/
  log_dir: logs/
  save_top_k: 3
